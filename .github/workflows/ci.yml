name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Testes (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Executar suíte de testes unitários
        shell: bash
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Executar auditor independente SQLite
        shell: bash
        run: |
          python tools/verify_independent.py

  packaging:
    name: Empacotamento e Verificação Isolada de Rede
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar ferramentas de build
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Construir distribuições (sdist e wheel)
        run: |
          python -m build

      - name: Inspecionar e validar arquivos construídos
        run: |
          python scripts/check_distribution.py

      - name: Testar instalação limpa do wheel e comandos CLI
        run: |
          python -m pip install dist/*.whl
          lajes-concreto --ajuda
          lajes-concreto calcular examples/laje_piso_residencial_cruz.json --formato texto
          lajes-concreto calcular examples/laje_unidirecional_corredor_com_continuidade.json --formato json

      - name: Testar execução sem acesso à rede (Network Isolation)
        run: |
          if command -v unshare >/dev/null 2>&1 && unshare -r -n true 2>/dev/null; then
            unshare -r -n python3 -m unittest discover -s tests -v
            unshare -r -n python3 tools/verify_independent.py
          else
            echo "Aviso: unshare de rede indisponível; executando testes locais."
            python3 -m unittest discover -s tests -v
            python3 tools/verify_independent.py
          fi
